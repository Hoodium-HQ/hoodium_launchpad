<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Strict CSP.

      This meta policy is the floor. Serve the same policy as a response header in
      production: a meta CSP cannot express `frame-ancestors`, so clickjacking
      protection has to come from the header.

      `%CSP_CONNECT_SRC%`, `%CSP_IMG_SRC%` and `%CSP_FRAME_SRC%` are substituted at
      build/serve time from VITE_API_URL and VITE_RPC_URL plus Reown AppKit's fixed
      origins (see vite.config.ts). Both this policy and the dev-server header are
      enforced together and the browser applies the intersection, so the origins
      have to come from one place — a hard-coded list here silently blocks whatever
      the header allows.

      `img-src` needs the API origin, not just `'self'`: token logos are proxied by
      the backend precisely so no third-party image host is contacted, and in
      development that backend is a different port. Where the API shares the page's
      origin this collapses back to `'self'`. It also carries the wallet-registry
      image hosts, which are the one third-party image source here — those URLs are
      minted by Reown at modal-open time, so there is nothing to proxy.

      `font-src` is `'self'` only: Geist is bundled by Vite and served from our
      own origin, and AppKit's request for fonts.googleapis.com is left blocked.

      No analytics scripts anywhere: a third-party script on a route where a user
      signs a transaction is a supply-chain risk with no upside.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src %CSP_IMG_SRC%;
        font-src 'self' data:;
        manifest-src 'self';
        worker-src 'self';
        connect-src %CSP_CONNECT_SRC%;
        frame-src %CSP_FRAME_SRC%;
        object-src 'none';
        base-uri 'none';
        form-action 'none';
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      Indexing. This is the static floor, correct for the explore page. Routes
      that should not be indexed — a profile before a wallet is connected, the
      not-found page — rewrite it to `noindex` from `src/lib/seo.ts` once the
      app runs.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Kept in step with DEFAULT_TITLE / DEFAULT_DESCRIPTION in `src/lib/seo.ts`. -->
    <title>Hoodium Launchpad: launch and trade tokens on Robinhood Chain</title>
    <meta
      name="description"
      content="Launch and explore fixed-supply tokens on Robinhood Chain. Bonding curves priced in USDG that graduate into locked Uniswap v3 liquidity. Your wallet submits every transaction; Hoodium never custodies assets."
    />

    <!--
      Brand assets live in `public/`. The SVG favicon is served first because
      it stays sharp at every size; the .ico is the fallback for browsers that
      still ignore SVG favicons.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Home-screen install. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A0B0A" />

    <!-- Share previews — the app-level default; per-token OG tags are a later concern. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hoodium Launchpad" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="Hoodium Launchpad: launch and trade tokens on Robinhood Chain" />
    <meta property="og:url" content="https://launchpad.hoodium.app/" />
    <meta
      property="og:description"
      content="Launch and explore fixed-supply tokens on Robinhood Chain. Bonding curves priced in USDG that graduate into locked Uniswap v3 liquidity. Your wallet submits every transaction; Hoodium never custodies assets."
    />
    <!-- Absolute, not `/logo.png`: enough unfurlers (Slack, several Telegram
         clients) drop a relative og:image outright. -->
    <meta property="og:image" content="https://launchpad.hoodium.app/logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hoodium Launchpad: launch and trade tokens on Robinhood Chain" />
    <meta
      name="twitter:description"
      content="Launch and explore fixed-supply tokens on Robinhood Chain. Bonding curves priced in USDG that graduate into locked Uniswap v3 liquidity. Your wallet submits every transaction; Hoodium never custodies assets."
    />
    <meta name="twitter:image" content="https://launchpad.hoodium.app/logo.png" />
    <link rel="canonical" href="https://launchpad.hoodium.app/" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      What this page says when nothing runs it. Until the bundle executes,
      `#root` is empty — which is the whole document for a crawler that does
      not render JavaScript. This is the site's claim in its own words, plus
      the machine-readable route into the figures. Keep it in step with the
      description in the head.
    -->
    <noscript>
      <main style="margin: 0 auto; max-width: 46rem; padding: 3rem 1.25rem; line-height: 1.6">
        <h1>Hoodium Launchpad: launch and trade tokens on Robinhood Chain</h1>

        <p>
          Hoodium Launchpad lets anyone deploy a fixed-supply token on Robinhood Chain in one
          transaction. Each token trades on a bonding curve priced in USDG until it reaches its
          graduation target, at which point the curve closes and its reserve becomes a Uniswap v3
          position whose liquidity is locked for good. Every trade, launch and fee is public chain
          state; the pages here are a reading of it.
        </p>

        <p>
          Your wallet signs every transaction and Hoodium custodies nothing. Anyone can launch a
          token, Hoodium does not review or endorse any of them, and most never graduate. You can
          lose everything you put in.
        </p>

        <h2>Pages</h2>
        <ul>
          <li><a href="/">Explore</a>: tokens on the curve and tokens that graduated.</li>
          <li><a href="/create">Create</a>: launch a token.</li>
          <li><a href="/profile">Profile</a>: holdings, launches and trades of an address.</li>
        </ul>

        <p>
          To use the site itself, enable JavaScript. Signing a transaction needs a wallet in the
          browser, and there is no server-rendered path to that.
        </p>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
