[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
# LP-N4: "Curve math SHALL be fuzz-tested for invariant violations across the
# full input range." Every historically drained bonding curve was drained through
# rounding, not through a dramatic exploit — so this budget is deliberately high.
runs = 4096
max_test_rejects = 200000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 20000

[profile.deep.fuzz]
runs = 200000
